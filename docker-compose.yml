services:
  backend:
    build: ./backend
    container_name: medicine_reminder_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: medicine_reminder_redis
    
    ports:
      - "6379:6379"
    
    restart: unless-stopped     

    volumes:
      - redis_data:/data

  db:
    image: postgres:17
    container_name: medicine_reminder_db

    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data

  celery_worker:
    build: ./backend
    container_name: medicine_reminder_celery_worker

    command: celery -A app.celery_app:celery_app worker --loglevel=info

    env_file:
      - ./backend/.env

    depends_on:
      - db
      - redis

  celery_beat:
    build: ./backend
    container_name: medicine_reminder_celery_beat

    command: celery -A app.celery_app:celery_app beat --loglevel=info

    env_file:
      - ./backend/.env

    depends_on:
      - db
      - redis

volumes:
  db_data:
  redis_data: